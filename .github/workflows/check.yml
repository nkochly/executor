name: check

on:
  pull_request:
  push:
    branches: [claude/project-thread-qw4ysu]
  workflow_dispatch:

permissions: {}

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      BUN_VERSION: 1.4.4
      BUN_SHA256: e0446eb55995772eb9894bebae9a6be368d985a8b9271ee124486f9946eedd76
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Install Bun
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bun.zip" \
            "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64-baseline.zip"
          echo "${BUN_SHA256}  $RUNNER_TEMP/bun.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP/bun"
          echo "$RUNNER_TEMP/bun/bun-linux-x64-baseline" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bun run check
