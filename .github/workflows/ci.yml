# Merge gates for the fork: format, lint, typecheck and unit tests on every
# pull request and push to main. This repo is public, and the Cloudflare
# runners (nkochly/cf-github-runners) refuse public repos, so these jobs run on
# GitHub-hosted runners with no secrets. Upstream's deploy, preview and publish
# workflows are removed: the fork deploys only through the Trifecta Alchemy
# stack (nkochly/wiki_mcp trifecta/).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DO_NOT_TRACK: "1"
  EXECUTOR_DISABLE_ANALYTICS: "1"
  EXECUTOR_DISABLE_INTEGRATIONS_FETCH: "1"

jobs:
  check:
    name: ${{ matrix.script }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        script: [format:check, lint, typecheck, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run ${{ matrix.script }}
