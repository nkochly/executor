# Merge gates for the fork: format, lint, typecheck, unit tests and a blocking
# dependency audit on every
# pull request and push to main. This repo is public, and the Cloudflare
# runners (nkochly/cf-github-runners) refuse public repos, so these jobs run on
# GitHub-hosted runners with no secrets. Upstream's deploy, preview and publish
# workflows are removed: the fork deploys only through the Trifecta Alchemy
# stack (nkochly/wiki_mcp trifecta/).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DO_NOT_TRACK: "1"
  EXECUTOR_DISABLE_ANALYTICS: "1"
  EXECUTOR_DISABLE_INTEGRATIONS_FETCH: "1"

jobs:
  check:
    name: ${{ matrix.script }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        script: [format:check, lint, typecheck, test]
    env:
      # Upstream runs tests on 16 vCPU; hosted runners have 4, so fewer
      # packages test at once: under contention the cold-start tests (tool discovery, host-cloudflare worker e2e) exceed their 5-10s timeouts.
      TURBO_TEST_CONCURRENCY: 1
      VITEST_MAX_WORKERS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run ${{ matrix.script }}

  audit:
    name: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      # Blocking at every severity. The only advisories it lets through are the
      # ones listed, each with its reason, in .github/audit-exceptions.txt.
      - name: bun audit
        run: |
          ignores=$(grep -Ev '^[[:space:]]*(#|$)' .github/audit-exceptions.txt | sed 's/^/--ignore=/' | tr '\n' ' ')
          bun audit --audit-level=low $ignores
