name: comment-ratchet

on:
  pull_request:
  push:
    branches: [claude/project-thread-qw4ysu]
  workflow_dispatch:

permissions: {}

jobs:
  comment-ratchet:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node scripts/comment-ratchet.mjs
